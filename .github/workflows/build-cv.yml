name: Build CV PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile CV
        run: |
          mkdir -p build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -pdflatex="pdflatex -no-shell-escape %O %S" resume.tex

      - name: Upload PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sebastian-Hallman-CV
          path: build/resume.pdf
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Save PDF in repository
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-cv-main
      cancel-in-progress: false
    steps:
      - name: Check out the built revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download compiled PDF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Sebastian-Hallman-CV
          path: .

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged."
            exit 0
          fi
          git commit -m "Update compiled CV PDF [skip ci]"
          git push origin HEAD:main
